name = "fuglede_reproduction"
version = "0.1.0"
defaultTargets = ["FugledeCounterexample", "Audit"]
moreLeanArgs = ["-DwarningAsError=true", "-Ddebug.skipKernelTC=false"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "FugledeCounterexample"
roots = ["CanonicalDefinitions", "CubeSampling", "CubeGeometry", "FiniteNontile", "TilingTransfer", "FiniteSpectralSeeds", "FiniteSpectral", "ConcreteNontile", "BlockSpectrum", "ConcreteSpectrum", "FourierCube", "SpectralSlices", "CubeCharacters", "CubeOrthogonality", "SpectralCubeBridge", "FugledeCounterexample"]

[[lean_lib]]
name = "Audit"
